<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Teacher Command Center</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="toast">Syncing...</div>

  <!-- LOGIN VIEW -->
  <div id="login-view" class="main-content" style="max-width: 400px; margin: auto; display: flex; flex-direction: column; justify-content: center;">
    <div class="card">
      <h2>🍎 Teacher Login</h2>
      <input type="text" id="t-id" placeholder="Teacher ID (e.g., T01)">
      <input type="password" id="t-pass" placeholder="Password">
      <button class="btn" onclick="loginTeacher()">Enter Dashboard</button>
    </div>
  </div>

  <!-- DASHBOARD SHELL -->
  <div id="app-shell" class="app-container hidden">
    <nav class="nav-bar">
      <button class="nav-btn active" onclick="switchTab('classes', this)"><span class="icon">🏫</span>Classes</button>
      <button class="nav-btn" onclick="switchTab('students', this)"><span class="icon">👥</span>Students</button>
      <button class="nav-btn" onclick="switchTab('points', this)"><span class="icon">⭐</span>Points</button>
      <button class="nav-btn" onclick="switchTab('history', this)"><span class="icon">📋</span>History</button>
    </nav>

    <main class="main-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
        <h3 id="welcome-msg">Welcome</h3>
        <select id="active-class-select" style="width:auto; margin:0;" onchange="onClassChange()"></select>
      </div>

      <!-- 1. MANAGE CLASS -->
      <section id="tab-classes" class="tab-view">
        <div class="card">
          <h3>Create New Class</h3>
          <input type="text" id="new-class-name" placeholder="e.g., Grade 10 - Newton">
          <button class="btn" onclick="createClass()">+ Add Class</button>
        </div>
        <div class="card">
          <h3>Your Classes</h3>
          <div id="class-list"></div>
        </div>
      </section>

      <!-- 2. MANAGE STUDENTS (BULK) -->
      <section id="tab-students" class="tab-view hidden">
        <div class="card">
          <h3>Bulk Add Students</h3>
          <p style="font-size:12px; color:var(--muted); margin-bottom:8px;">Format: <code>StudentID, Full Name</code> (One per line)</p>
          <textarea id="bulk-student-input" rows="6" placeholder="2026001, Juan Dela Cruz&#10;2026002, Maria Clara"></textarea>
          <button class="btn" onclick="bulkAddStudents()">Upload Roster</button>
        </div>
        <div class="card">
          <h3>Enrolled Students (<span id="student-count">0</span>)</h3>
          <div id="roster-list"></div>
        </div>
      </section>

      <!-- 3. MANAGE POINTS (BULK + CHECKLIST) -->
      <section id="tab-points" class="tab-view hidden">
        <div class="card">
          <h3>Award Task Points</h3>
          <input type="text" id="task-name" placeholder="Task Name (e.g., Quiz 1, Recitation)">
          <div class="grid-2">
            <input type="number" id="task-points" placeholder="Points (e.g., 10)" value="5">
            <button class="btn btn-sm" style="height:40px;" onclick="toggleAllCheckboxes()">Select / Deselect All</button>
          </div>
          <div id="student-checklist" style="max-height: 250px; overflow-y: auto; margin-bottom: 12px;"></div>
          <button class="btn btn-gold" onclick="submitBulkPoints()">Credit Selected Students</button>
        </div>
      </section>

      <!-- 4. HISTORY / E-CLASS RECORD -->
      <section id="tab-history" class="tab-view hidden">
        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>E-Class Record</h3>
            <button class="btn btn-sm" onclick="loadHistory()">🔄 Refresh</button>
          </div>
          <input type="text" id="filter-task" placeholder="Filter by Task Name to see who is missing..." onkeyup="renderHistory()">
          <div id="history-output"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="teacher.js"></script>
</body>
</html>
